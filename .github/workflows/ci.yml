name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run the suite by hand from the Actions tab.
  workflow_dispatch:

# The suite only reads the checkout; no token write access is needed.
permissions:
  contents: read

# A new push to the same branch cancels the previous, still-running check.
# Never cancel on main, so every merged commit keeps a real result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # jsdom is the only dependency, and it is dev-only — the app itself
      # ships zero dependencies.
      - name: Install dev dependencies
        run: npm ci

      - name: Run tests
        # Turns a missing jsdom into a failure rather than a silent skip.
        env:
          REQUIRE_DOM_TESTS: '1'
        run: npm test

      - name: Verify workout config
        run: npm run verify

  # Proves the app still works with nothing installed, which is how it is
  # actually served. Catches a stray runtime import of a devDependency.
  no-install:
    name: Runs without dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run the dependency-free suites
        run: npm test

      - name: Verify workout config
        run: npm run verify
