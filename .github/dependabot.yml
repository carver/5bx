version: 2

updates:
  # Keeps the pinned action majors current (actions/checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # jsdom is the only dependency, and it is dev-only. Monthly is plenty.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
